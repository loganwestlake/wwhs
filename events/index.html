<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events · WWHS</title>
<meta name="description" content="Upcoming events at WWHS — academics, athletics, arts, and clubs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root{
    --bg: #ffffff;
    --bg-alt: #f8fafc;
    --surface: rgba(255,255,255,0.85);
    --surface-solid: #ffffff;
    --border: rgba(15,23,42,0.08);
    --border-strong: rgba(15,23,42,0.14);
    --text: #0f172a;
    --text-dim: #475569;
    --text-faint: #94a3b8;
    --emerald: #10b981;
    --emerald-600: #059669;
    --emerald-soft: rgba(16,185,129,0.12);
    --emerald-glow: rgba(16,185,129,0.35);
    --shadow: rgba(15,23,42,0.08);
    --scrollbar: rgba(15,23,42,0.18);
  }
  [data-theme="dark"]{
    --bg: #0b1120;
    --bg-alt: #0e1526;
    --surface: rgba(15,23,42,0.85);
    --surface-solid: #101827;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --text-faint: #64748b;
    --emerald: #34d399;
    --emerald-600: #10b981;
    --emerald-soft: rgba(52,211,153,0.14);
    --emerald-glow: rgba(52,211,153,0.35);
    --shadow: rgba(0,0,0,0.45);
    --scrollbar: rgba(255,255,255,0.15);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s ease, color 0.3s ease;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 12% 8%, var(--emerald-soft), transparent 40%),
      radial-gradient(circle at 88% 18%, var(--emerald-soft), transparent 35%),
      radial-gradient(circle at 50% 100%, rgba(16,185,129,0.06), transparent 45%);
    pointer-events:none;
  }

  ::selection{ background: var(--emerald-soft); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--scrollbar); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--emerald); }
  html{ scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  :focus-visible{
    outline: 2px solid var(--emerald);
    outline-offset: 3px;
    border-radius: 6px;
  }

  .wrap{ max-width:1120px; margin:0 auto; padding:0 24px; }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom:1px solid var(--border);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    height:72px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:1.1rem; letter-spacing:-0.02em;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background: linear-gradient(135deg, var(--emerald), var(--emerald-600));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:900; font-size:0.95rem;
    box-shadow: 0 6px 16px -4px var(--emerald-glow);
  }
  .brand small{
    color: var(--emerald);
    font-weight:700;
  }
  nav.links{
    display:flex; align-items:center; gap:6px;
  }
  nav.links a{
    padding:8px 14px; border-radius:10px;
    font-weight:600; font-size:0.92rem; color: var(--text-dim);
    transition: color 0.2s, background 0.2s;
  }
  nav.links a:hover{ color: var(--text); background: var(--border); }
  nav.links a.active{
    color: var(--emerald-600);
    background: var(--emerald-soft);
  }
  .nav-right{ display:flex; align-items:center; gap:10px; }

  .theme-toggle{
    width:40px; height:40px; border-radius:12px;
    border:1px solid var(--border-strong);
    background: var(--surface-solid);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
    transition: border-color 0.2s, transform 0.15s;
  }
  .theme-toggle:hover{ border-color: var(--emerald); color: var(--emerald); }
  .theme-toggle:active{ transform: scale(0.94); }
  .theme-toggle svg{ width:18px; height:18px; }
  [data-theme="dark"] .icon-sun{ display:block; }
  [data-theme="dark"] .icon-moon{ display:none; }
  [data-theme="light"] .icon-sun{ display:none; }
  [data-theme="light"] .icon-moon{ display:block; }

  .menu-btn{
    display:none;
    width:40px; height:40px; border-radius:12px;
    border:1px solid var(--border-strong);
    background: var(--surface-solid);
    align-items:center; justify-content:center;
    color: var(--text);
  }
  .menu-btn svg{ width:20px; height:20px; }

  @media (max-width: 780px){
    nav.links{
      position:absolute; top:72px; left:0; right:0;
      flex-direction:column; align-items:stretch;
      background: var(--surface-solid);
      border-bottom:1px solid var(--border);
      padding:10px 24px 18px;
      display:none;
      gap:4px;
    }
    nav.links.open{ display:flex; }
    nav.links a{ width:100%; }
    .menu-btn{ display:flex; }
  }

  /* ---------- Hero ---------- */
  .hero{ padding:64px 0 40px; }
  .eyebrow-row{
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--emerald);
    box-shadow: 0 0 0 0 var(--emerald-glow);
    animation: pulseDot 2.2s infinite;
  }
  @keyframes pulseDot{
    0%{ box-shadow: 0 0 0 0 var(--emerald-glow); }
    70%{ box-shadow: 0 0 0 8px transparent; }
    100%{ box-shadow: 0 0 0 0 transparent; }
  }
  .eyebrow-text{
    font-size:0.85rem; font-weight:700; color: var(--text-dim);
  }
  h1.title{
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    font-weight:900; letter-spacing:-0.03em; line-height:1.05;
    margin:0 0 16px;
    max-width: 720px;
  }
  .hero p.sub{
    font-size:1.05rem; color: var(--text-dim);
    max-width:560px; line-height:1.6; margin:0;
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:12px;
    align-items:center; justify-content:space-between;
    margin: 32px 0 28px;
  }
  .filters{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .filter-pill{
    padding:9px 16px; border-radius:999px;
    font-size:0.85rem; font-weight:700;
    border:1px solid var(--border-strong);
    background: var(--surface-solid);
    color: var(--text-dim);
    transition: all 0.2s ease;
  }
  .filter-pill:hover{ border-color: var(--emerald); color: var(--text); }
  .filter-pill.active{
    background: var(--emerald);
    border-color: var(--emerald);
    color:#04160f;
    box-shadow: 0 6px 18px -6px var(--emerald-glow);
  }
  .search-box{
    position:relative;
    min-width:220px; flex:1; max-width:280px;
  }
  .search-box input{
    width:100%; padding:10px 14px 10px 38px;
    border-radius:999px; border:1px solid var(--border-strong);
    background: var(--surface-solid); color: var(--text);
    font-size:0.88rem; font-weight:500;
    transition: border-color 0.2s;
  }
  .search-box input:focus{ border-color: var(--emerald); }
  .search-box svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color: var(--text-faint);
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap:20px;
    padding-bottom:70px;
  }

  .card{
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--border);
    border-radius: 26px;
    padding:22px;
    display:flex; flex-direction:column; gap:16px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    border-color: var(--emerald);
    box-shadow: 0 20px 40px -20px var(--shadow), 0 0 0 1px var(--emerald-soft);
  }

  .card-top{ display:flex; gap:14px; align-items:flex-start; }

  .date-block{
    flex-shrink:0;
    width:60px; text-align:center;
    border:1px solid var(--border-strong);
    border-radius:16px;
    padding:8px 0 10px;
    background: var(--bg-alt);
  }
  .date-block .month{
    font-size:0.68rem; font-weight:800; letter-spacing:0.06em;
    color: var(--emerald-600);
  }
  .date-block .day{
    font-size:1.5rem; font-weight:900; line-height:1.1; letter-spacing:-0.02em;
  }

  .card-heading{ flex:1; min-width:0; }
  .next-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.68rem; font-weight:800; letter-spacing:0.04em;
    color: var(--emerald-600); margin-bottom:6px;
  }
  .next-badge .dot{
    width:6px; height:6px; border-radius:50%; background: var(--emerald);
    animation: pulseDot 2.2s infinite;
  }
  .card h3{
    margin:0 0 4px; font-size:1.12rem; font-weight:800; letter-spacing:-0.01em;
    line-height:1.3;
  }
  .card .meta-line{
    font-size:0.82rem; color: var(--text-dim); font-weight:600;
  }

  .card p.desc{
    margin:0; font-size:0.9rem; color: var(--text-dim); line-height:1.55;
    flex:1;
  }

  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:14px; border-top:1px solid var(--border);
  }
  .category-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.75rem; font-weight:700; color: var(--text-dim);
  }
  .category-tag .swatch{ width:7px; height:7px; border-radius:50%; }

  .card-actions{ display:flex; gap:6px; align-items:center; }
  .ics-btn, .admin-action-btn{
    display:flex; align-items:center; gap:6px;
    font-size:0.78rem; font-weight:700;
    color: var(--emerald-600);
    padding:6px 10px; border-radius:999px;
    border:1px solid transparent; background: transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .ics-btn:hover, .admin-action-btn:hover{ background: var(--emerald-soft); border-color: var(--emerald-glow); }
  .ics-btn svg, .admin-action-btn svg{ width:13px; height:13px; }

  /* ---------- Admin Floating Lock Button ---------- */
  .admin-trigger {
    position: fixed; bottom: 24px; right: 24px; z-index: 99;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--surface-solid); border: 1px solid var(--border-strong);
    color: var(--text-dim); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 25px -5px var(--shadow);
    transition: transform 0.2s, border-color 0.2s, color 0.2s;
  }
  .admin-trigger:hover { border-color: var(--emerald); color: var(--emerald); transform: scale(1.05); }
  .admin-trigger svg { width: 18px; height: 18px; }

  /* ---------- Admin Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px); z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface-solid); border: 1px solid var(--border);
    border-radius: 24px; width: 100%; max-width: 520px; max-height: 90vh;
    overflow-y: auto; padding: 28px; box-shadow: 0 25px 50px -12px var(--shadow);
  }
  .modal h2 { margin: 0 0 20px; font-size: 1.3rem; font-weight: 800; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-strong);
    background: var(--bg); color: var(--text); font-size: 0.9rem; font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--emerald); outline: none; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn { padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; border: 1px solid transparent; }
  .btn-primary { background: var(--emerald); color: #04160f; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: var(--bg-alt); color: var(--text-dim); border-color: var(--border-strong); }
  .btn-secondary:hover { color: var(--text); }
  .btn-danger { background: rgba(239, 68, 68, 0.12); color: #ef4444; }

  /* ---------- States ---------- */
  .state{
    grid-column: 1 / -1;
    text-align:center;
    padding:70px 20px;
    color: var(--text-dim);
  }
  .state h3{ margin:0 0 8px; color: var(--text); font-size:1.2rem; font-weight:800; }
  .state p{ margin:0; font-size:0.92rem; max-width:360px; margin:0 auto; }

  .skeleton{
    height: 210px; border-radius:26px;
    background: linear-gradient(100deg, var(--border) 30%, var(--border-strong) 50%, var(--border) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--border);
    padding:32px 0 40px;
  }
  footer .wrap{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px;
  }
  footer p{ margin:0; font-size:0.85rem; color: var(--text-faint); }
  footer .foot-links{ display:flex; gap:18px; }
  footer .foot-links a{ font-size:0.85rem; color: var(--text-dim); font-weight:600; }
  footer .foot-links a:hover{ color: var(--emerald-600); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body data-theme="light">

<header>
  <div class="wrap nav">
    <div class="brand">
      <div class="brand-mark">W</div>
      <span>WWHS<small>.pro</small></span>
    </div>
    <nav class="links" id="navLinks">
      <a href="/">Home</a>
      <a href="/academics">Academics</a>
      <a href="/athletics">Athletics</a>
      <a href="/events" class="active">Events</a>
      <a href="/clubs">Clubs</a>
      <a href="/contact">Contact</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6z"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="eyebrow-row">
      <span class="live-dot"></span>
      <span class="eyebrow-text" id="countLabel">Loading schedule…</span>
    </div>
    <h1 class="title">Everything coming up at WWHS.</h1>
    <p class="sub">Academic dates, games, performances, and club meetings, kept current as they're scheduled.</p>
  </section>

  <div class="controls">
    <div class="filters" id="filters">
      <button class="filter-pill active" data-cat="all">All</button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="searchInput" placeholder="Search events…">
    </div>
  </div>

  <section class="grid" id="grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </section>

</main>

<!-- Floating Admin Lock Button -->
<button class="admin-trigger" id="adminTrigger" aria-label="Admin Control">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
</button>

<!-- Admin Modal / Dashboard -->
<div class="modal-backdrop" id="adminModal">
  <div class="modal" id="modalContent">
    <!-- Injected dynamically via JS depending on Auth state -->
  </div>
</div>

<footer>
  <div class="wrap">
    <p>© <span id="year"></span> WWHS. All events subject to change.</p>
    <div class="foot-links">
      <a href="/calendar">Full calendar</a>
      <a href="/contact">Submit an event</a>
    </div>
  </div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC-WOH239fwkAkA7gY-2XUDRok8cs1NiAA",
    authDomain: "wwhs-pro.firebaseapp.com",
    databaseURL: "https://wwhs-pro-default-rtdb.firebaseio.com",
    projectId: "wwhs-pro",
    storageBucket: "wwhs-pro.firebasestorage.app",
    messagingSenderId: "467273432534",
    appId: "1:467273432534:web:91b9e03a6885420ae3f877"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const grid = document.getElementById('grid');
  const countLabel = document.getElementById('countLabel');
  const filtersEl = document.getElementById('filters');
  const searchInput = document.getElementById('searchInput');
  const adminTrigger = document.getElementById('adminTrigger');
  const adminModal = document.getElementById('adminModal');
  const modalContent = document.getElementById('modalContent');

  let allEvents = [];
  let activeCategory = 'all';
  let searchTerm = '';
  let currentUser = null;
  let promotedEventId = localStorage.getItem('wwhs_promoted_id') || null;

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    render();
  });

  adminTrigger.addEventListener('click', () => {
    adminModal.classList.add('open');
    renderModalContent();
  });

  // PREVENT ACCIDENTAL CLOSING: Clicking outside the modal backdrop no longer clears progress
  adminModal.addEventListener('click', (e) => {
    // Intentionally disabled backdrop click closing to protect input data
  });

  function renderModalContent(editData = null) {
    if (!currentUser) {
      modalContent.innerHTML = `
        <h2>Admin Sign In</h2>
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required placeholder="admin@wwhs.pro">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" required placeholder="••••••••">
          </div>
          <div class="modal-btns">
            <button type="button" class="btn btn-secondary" id="closeModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Sign In</button>
          </div>
        </form>
      `;
      document.getElementById('closeModal').onclick = () => adminModal.classList.remove('open');
      document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        try {
          await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
          adminModal.classList.remove('open');
        } catch(err) {
          alert('Login failed: ' + err.message);
        }
      };
    } else {
      const isEditing = !!editData;
      modalContent.innerHTML = `
        <h2>${isEditing ? 'Edit Event' : 'Add New Event'}</h2>
        <form id="eventForm">
          <div class="form-group">
            <label>Event Title</label>
            <input type="text" id="evTitle" required value="${isEditing ? escapeHTML(editData.title) : ''}" placeholder="Fall Choir Concert">
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="evCategory" required value="${isEditing ? escapeHTML(editData.category) : 'Arts'}" placeholder="Arts, Athletics, Academics...">
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="evDate" required value="${isEditing ? editData.date : ''}">
          </div>
          <div class="form-group">
            <label>Time (optional)</label>
            <input type="text" id="evTime" value="${isEditing ? escapeHTML(editData.time || '') : ''}" placeholder="6:30 PM">
          </div>
          <div class="form-group">
            <label>Location (optional)</label>
            <input type="text" id="evLocation" value="${isEditing ? escapeHTML(editData.location || '') : ''}" placeholder="Main Auditorium">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="evDesc" rows="3" placeholder="Brief summary...">${isEditing ? escapeHTML(editData.description || '') : ''}</textarea>
          </div>
          <div class="modal-btns" style="justify-content:space-between; align-items:center;">
            <button type="button" class="btn btn-danger" id="signOutBtn">Sign Out</button>
            <div style="display:flex; gap:10px;">
              <button type="button" class="btn btn-secondary" id="closeModal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="saveEventBtn">${isEditing ? 'Save Changes' : 'Publish Event'}</button>
            </div>
          </div>
        </form>
      `;
      document.getElementById('closeModal').onclick = () => adminModal.classList.remove('open');
      document.getElementById('signOutBtn').onclick = async () => {
        await signOut(auth);
        adminModal.classList.remove('open');
      };
      
      document.getElementById('eventForm').onsubmit = async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveEventBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        const payload = {
          title: document.getElementById('evTitle').value.trim(),
          category: document.getElementById('evCategory').value.trim(),
          date: document.getElementById('evDate').value,
          time: document.getElementById('evTime').value.trim(),
          location: document.getElementById('evLocation').value.trim(),
          description: document.getElementById('evDesc').value.trim(),
        };

        try {
          if (isEditing) {
            await update(ref(db, `events/${editData.id}`), payload);
          } else {
            await push(ref(db, 'events'), payload);
          }
          adminModal.classList.remove('open');
        } catch(err) {
          alert('Error saving event: ' + err.message);
          saveBtn.disabled = false;
          saveBtn.textContent = isEditing ? 'Save Changes' : 'Publish Event';
        }
      };
    }
  }

  const dotColors = ['#10b981', '#3b82f6', '#8b5cf6', '#f59e0b', '#ec4899'];
  const catColorMap = {};
  function colorFor(cat){
    if(!catColorMap[cat]){
      const used = Object.keys(catColorMap).length;
      catColorMap[cat] = dotColors[used % dotColors.length];
    }
    return catColorMap[cat];
  }

  function parseDate(ev){
    if (!ev || !ev.date) return null;
    const d = new Date(`${ev.date}T00:00:00`);
    return isNaN(d.getTime()) ? null : d;
  }

  function isUpcoming(ev){
    const d = parseDate(ev);
    if(!d) return false;
    const today = new Date();
    today.setHours(0,0,0,0);
    return d.getTime() >= today.getTime();
  }

  function formatMonthDay(d){
    return {
      month: d.toLocaleDateString('en-US', { month: 'short' }),
      day: d.getDate()
    };
  }

  function buildICS(ev){
    const cleanDate = ev.date.replace(/-/g,'');
    const uid = `${cleanDate}-${(ev.title || 'event').replace(/\s+/g,'')}@wwhs.pro`;
    const escapedTitle = (ev.title || 'Event').replace(/[,\\]/g, (m) => '\\' + m);
    const escapedDesc = (ev.description || '').replace(/[,\\]/g, (m) => '\\' + m).replace(/\n/g, '\\n');
    const escapedLoc = (ev.location || '').replace(/[,\\]/g, (m) => '\\' + m);

    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WWHS//Events Calendar//EN','BEGIN:VEVENT',
      `UID:${uid}`, `SUMMARY:${escapedTitle}`, `DTSTART;VALUE=DATE:${cleanDate}`, `DTEND;VALUE=DATE:${cleanDate}`,
      `LOCATION:${escapedLoc}`, `DESCRIPTION:${escapedDesc}`, 'END:VEVENT','END:VCALENDAR'
    ];
    
    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(ev.title || 'event').toLowerCase().replace(/[^a-z0-9]+/g,'-')}.ics`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function renderFilters(events){
    const cats = [...new Set(events.map(e => e.category).filter(Boolean))].sort();
    filtersEl.innerHTML = '';
    
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-pill' + (activeCategory === 'all' ? ' active' : '');
    allBtn.dataset.cat = 'all';
    allBtn.textContent = 'All';
    filtersEl.appendChild(allBtn);

    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-pill' + (activeCategory === cat ? ' active' : '');
      btn.dataset.cat = cat;
      btn.textContent = cat;
      filtersEl.appendChild(btn);
    });

    filtersEl.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        filtersEl.querySelectorAll('.filter-pill').forEach(b => {
          b.classList.toggle('active', b.dataset.cat === activeCategory);
        });
        render();
      });
    });
  }

  function render(){
    let events = allEvents.filter(isUpcoming);
    events.sort((a,b) => parseDate(a) - parseDate(b));

    if(activeCategory !== 'all'){
      events = events.filter(e => e.category === activeCategory);
    }
    if(searchTerm){
      const t = searchTerm.toLowerCase();
      events = events.filter(e =>
        (e.title || '').toLowerCase().includes(t) ||
        (e.location || '').toLowerCase().includes(t) ||
        (e.description || '').toLowerCase().includes(t)
      );
    }

    countLabel.textContent = events.length
      ? `${events.length} upcoming event${events.length === 1 ? '' : 's'}`
      : 'No events match right now';

    grid.innerHTML = '';

    if(!events.length){
      const state = document.createElement('div');
      state.className = 'state';
      state.innerHTML = allEvents.length
        ? `<h3>Nothing matches those filters</h3><p>Try a different category or clear your search.</p>`
        : `<h3>No upcoming events yet</h3><p>Check back soon — new dates are added as they're confirmed.</p>`;
      grid.appendChild(state);
      return;
    }

    events.forEach((ev, i) => {
      const d = parseDate(ev);
      const { month, day } = formatMonthDay(d);
      const card = document.createElement('article');
      card.className = 'card';

      const metaBits = [ev.time, ev.location].filter(Boolean).join(' · ');
      const color = colorFor(ev.category || 'General');
      const isNextUp = (promotedEventId ? ev.id === promotedEventId : i === 0) && activeCategory === 'all' && !searchTerm;

      card.innerHTML = `
        <div class="card-top">
          <div class="date-block">
            <div class="month">${month}</div>
            <div class="day">${day}</div>
          </div>
          <div class="card-heading">
            ${isNextUp ? '<div class="next-badge"><span class="dot"></span>Next up</div>' : ''}
            <h3>${escapeHTML(ev.title || 'Untitled event')}</h3>
            ${metaBits ? `<div class="meta-line">${escapeHTML(metaBits)}</div>` : ''}
          </div>
        </div>
        ${ev.description ? `<p class="desc">${escapeHTML(ev.description)}</p>` : ''}
        <div class="card-footer">
          <span class="category-tag"><span class="swatch" style="background:${color}"></span>${escapeHTML(ev.category || 'General')}</span>
          <div class="card-actions">
            <button class="ics-btn" type="button" aria-label="Add to calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
              Cal
            </button>
            ${currentUser ? `
              <button class="admin-action-btn promote-btn" title="Promote as Next Up">⭐</button>
              <button class="admin-action-btn edit-btn" title="Edit">✏️</button>
              <button class="admin-action-btn delete-btn" title="Delete">🗑️</button>
            ` : ''}
          </div>
        </div>
      `;

      card.querySelector('.ics-btn').addEventListener('click', () => buildICS(ev));
      
      if (currentUser) {
        card.querySelector('.promote-btn').addEventListener('click', () => {
          promotedEventId = ev.id;
          localStorage.setItem('wwhs_promoted_id', ev.id);
          render();
        });
        card.querySelector('.edit-btn').addEventListener('click', () => {
          adminModal.classList.add('open');
          renderModalContent(ev);
        });
        card.querySelector('.delete-btn').addEventListener('click', async () => {
          if(confirm(`Are you sure you want to delete "${ev.title}"?`)) {
            await remove(ref(db, `events/${ev.id}`));
          }
        });
      }

      grid.appendChild(card);
    });
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value.trim();
    render();
  });

  const eventsRef = ref(db, 'events');
  onValue(eventsRef, (snapshot) => {
    const val = snapshot.val();
    allEvents = val
      ? Object.entries(val).map(([id, data]) => ({ id, ...data }))
      : [];
    renderFilters(allEvents);
    render();
  }, (error) => {
    console.error('Failed to load events:', error);
    countLabel.textContent = 'Could not load the schedule';
    grid.innerHTML = `
      <div class="state">
        <h3>Could not load events</h3>
        <p>There was a problem reaching the schedule. Please refresh or try again shortly.</p>
      </div>`;
  });

  // ---------- Theme toggle ----------
  const themeToggle = document.getElementById('themeToggle');
  const stored = localStorage.getItem('wwhs-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initial = stored || (prefersDark ? 'dark' : 'light');
  document.body.setAttribute('data-theme', initial);

  themeToggle.addEventListener('click', () => {
    const current = document.body.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    localStorage.setItem('wwhs-theme', next);
  });

  // ---------- Mobile menu ----------
  const menuBtn = document.getElementById('menuBtn');
  const navLinks = document.getElementById('navLinks');
  menuBtn.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', isOpen);
  });

  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
