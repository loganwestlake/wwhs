<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WWHS Schedule Share</title>
    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --surface-glass: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --radius: 20px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* Abstract Animated Background */
        .abstract-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            overflow: hidden;
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.45;
            animation: floatBlob 12s infinite alternate ease-in-out;
        }
        .blob-1 {
            width: 450px;
            height: 450px;
            background: #10b981;
            top: -100px;
            left: -100px;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: #6366f1;
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }
        .blob-3 {
            width: 300px;
            height: 300px;
            background: #0ea5e9;
            top: 40%;
            left: 30%;
            animation-delay: -8s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.1); }
            100% { transform: translate(-30px, -40px) scale(0.95); }
        }

        /* Splash Screen (6 Seconds, Floating Logo) */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .floating-logo-container {
            animation: floatLogo 3s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), #0ea5e9);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 38px;
            font-weight: 800;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.4);
            margin-bottom: 24px;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .splash-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .splash-loader-bar {
            width: 160px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 24px;
            overflow: hidden;
            position: relative;
        }

        .splash-loader-progress {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 100%;
            background: var(--primary);
            border-radius: 10px;
            transform: translateX(-100%);
            animation: loadProgress 6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes loadProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0%); }
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Glassmorphism Auth / Cards */
        .auth-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            inset: 0;
            z-index: 100;
        }
        
        .glass-card {
            background: var(--surface-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
        }

        h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: #fff; }
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; color: #fff; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }

        /* Form Controls */
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group i {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); transition: var(--transition);
        }
        input {
            width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border);
            padding: 16px 16px 16px 50px; border-radius: 14px; font-size: 15px;
            font-weight: 500; color: var(--text-main); transition: var(--transition);
            outline: none;
        }
        input::placeholder { color: #64748b; }
        input:focus {
            background: rgba(15, 23, 42, 0.9); border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }
        input:focus + i, .input-group:focus-within i { color: var(--primary); }

        /* Buttons */
        .btn {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: var(--transition); display: flex; justify-content: center;
            align-items: center; gap: 10px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            color: white; 
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); 
        }
        .btn-primary:hover { box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-text { background: transparent; color: var(--primary); margin-top: 12px; font-size: 14px; }

        /* Stepper */
        .progress-container { display: flex; gap: 8px; margin-bottom: 28px; }
        .progress-bar { flex: 1; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; transition: var(--transition); }
        .progress-bar.active { background: var(--primary); box-shadow: 0 0 12px var(--primary); }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.4s ease; }
        .step-actions { display: flex; gap: 12px; margin-top: 24px; }

        /* Dashboard Layout */
        .app-container {
            flex: 1; display: flex; width: 100vw; height: 100vh; overflow: hidden;
        }
        
        .sidebar {
            display: none;
            width: 280px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            padding: 32px 24px;
            flex-direction: column;
        }
        .sidebar-logo { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 40px; display: flex; align-items: center; gap: 14px;}
        .sidebar-nav { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        
        .nav-item {
            display: flex; align-items: center; gap: 14px; padding: 16px;
            border-radius: 14px; color: var(--text-muted); font-weight: 600;
            cursor: pointer; transition: var(--transition); background: transparent; border: none; width: 100%; text-align: left; font-size: 15px;
        }
        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .nav-item.active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        
        .main-content-area {
            flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden;
        }
        
        .mobile-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
        }
        
        .main-content {
            flex: 1; overflow-y: auto; padding: 32px;
            padding-bottom: calc(110px + var(--safe-bottom));
        }
        .content-max-width { max-width: 1000px; margin: 0 auto; }

        .card {
            background: var(--surface-glass); backdrop-filter: blur(20px);
            border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: var(--surface-glass); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 24px;
        }
        .switch { position: relative; display: inline-block; width: 54px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px; border: 1px solid var(--border); }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: var(--primary); border-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        .timeline-item { display: flex; gap: 16px; margin-bottom: 18px; align-items: center; }
        .period-bubble {
            width: 46px; height: 46px; border-radius: 14px; background: rgba(16, 185, 129, 0.15);
            color: #34d399; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 15px; flex-shrink: 0; border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .class-info {
            background: rgba(15, 23, 42, 0.5); padding: 16px; border-radius: 14px;
            flex: 1; font-weight: 600; font-size: 15px; border: 1px solid var(--border); color: #e2e8f0;
        }

        .classmates-grid {
            display: grid; grid-template-columns: 1fr; gap: 20px;
        }
        .classmate-card {
            background: var(--surface-glass); backdrop-filter: blur(20px); border-radius: var(--radius); padding: 24px;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border); border-top: 4px solid var(--primary);
        }
        .cm-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
        .cm-avatar {
            width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #0ea5e9);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 800; flex-shrink: 0; box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }
        .cm-details h3 { font-size: 18px; margin: 0 0 4px 0; color: #fff; }
        .cm-details span { font-size: 13px; color: var(--text-muted); }
        .cm-classes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cm-class {
            background: rgba(15, 23, 42, 0.4); padding: 10px 12px; border-radius: 10px;
            font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); color: #cbd5e1;
        }
        .cm-class i { color: #34d399; font-size: 11px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px);
            display: flex; justify-content: space-around;
            padding: 12px 10px var(--safe-bottom) 10px;
            border-top: 1px solid var(--border); z-index: 100;
        }
        .bottom-nav .nav-item {
            flex-direction: column; gap: 4px; padding: 8px; border-radius: 0;
            font-size: 11px; flex: 1; align-items: center; justify-content: center;
        }
        .bottom-nav .nav-item i { font-size: 20px; }

        @media (min-width: 768px) {
            .sidebar { display: flex; }
            .bottom-nav { display: none; }
            .mobile-header { display: none; }
            .main-content { padding: 48px; }
            .classmates-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- Abstract Animated Background -->
    <div class="abstract-bg">
        <div class="blob blob-1"></div>
        <div class="blob-2"></div>
        <div class="blob-3"></div>
    </div>

    <!-- Stunning Splash Screen (6 Seconds with Floating Logo) -->
    <div id="splash-screen">
        <div class="floating-logo-container">
            <div class="logo-box">W</div>
            <div class="splash-title">WWHS</div>
            <p style="color: var(--text-muted); font-weight: 500; font-size: 15px;">Schedule Share Experience</p>
        </div>
        <div class="splash-loader-bar">
            <div class="splash-loader-progress"></div>
        </div>
    </div>

    <!-- Auth Wrapper -->
    <div class="auth-wrapper hidden" id="auth-view">
        <div class="glass-card fade-in" id="login-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <div class="logo-box" style="margin: 0 auto 16px auto; width: 70px; height: 70px; font-size: 26px; border-radius: 20px;">W</div>
                <h2>Welcome Back</h2>
                <p class="subtitle" style="margin-bottom:0;">Sign in to securely access your classes.</p>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="login-email" placeholder="School Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-password" placeholder="Password">
            </div>
            <button class="btn btn-primary" id="btn-login" style="margin-top: 10px;">Sign In</button>
            <button class="btn btn-text" id="link-to-signup">Create new account</button>
        </div>

        <div class="glass-card fade-in hidden" id="signup-card">
            <h2 style="text-align: center; margin-bottom: 20px;">Join WWHS</h2>
            
            <div class="progress-container">
                <div class="progress-bar active" id="prog-1"></div>
                <div class="progress-bar" id="prog-2"></div>
                <div class="progress-bar" id="prog-3"></div>
            </div>

            <div id="step-1" class="step-content active">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="School Email">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="Password (min 6 chars)">
                </div>
                <button class="btn btn-primary" id="btn-next-1" style="margin-top:20px;">Next</button>
                <button class="btn btn-text" id="link-to-login">Back to Sign In</button>
            </div>

            <div id="step-2" class="step-content">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="signup-name" placeholder="First & Last Name">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <input type="number" id="signup-grade" placeholder="Grade Level (9-12)">
                </div>
                <div class="step-actions">
                    <button class="btn btn-secondary btn-prev" data-target="1">Back</button>
                    <button class="btn btn-primary" id="btn-next-2">Next</button>
                </div>
            </div>

            <div id="step-3" class="step-content">
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px; text-align:center;">Enter your teachers or class names.</p>
                <div style="max-height: 220px; overflow-y: auto; padding-right: 5px;">
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p1" placeholder="Period 1"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p2" placeholder="Period 2"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p3" placeholder="Period 3"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p4" placeholder="Period 4"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p5" placeholder="Period 5"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p6" placeholder="Period 6"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p7" placeholder="Period 7"></div>
                </div>
                <div class="step-actions">
                    <button class="btn btn-secondary btn-prev" data-target="2">Back</button>
                    <button class="btn btn-primary" id="btn-finish">Complete Signup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Application -->
    <div class="app-container hidden" id="main-app">
        <nav class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-box" style="width: 38px; height:38px; font-size:16px; margin:0; border-radius:10px;">W</div> 
                WWHS Schedule
            </div>
            <div class="sidebar-nav">
                <button class="nav-item active" data-tab="schedule">
                    <i class="fa-solid fa-calendar-day"></i> My Schedule
                </button>
                <button class="nav-item" data-tab="classmates">
                    <i class="fa-solid fa-user-group"></i> Classmates
                </button>
                <button class="nav-item" data-tab="settings">
                    <i class="fa-solid fa-gear"></i> Settings
                </button>
            </div>
            <button class="btn btn-secondary" id="btn-logout-desk" style="color: #f87171; border-color: rgba(248, 113, 113, 0.2); margin-top: auto;">
                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
            </button>
        </nav>

        <div class="main-content-area">
            <div class="mobile-header">
                <h2 style="margin: 0; color: #fff; font-size: 18px;">WWHS Schedule</h2>
                <div id="mobile-avatar" class="cm-avatar" style="width: 36px; height: 36px; font-size: 14px;">?</div>
            </div>

            <main class="main-content">
                <div class="content-max-width">
                    <div id="tab-schedule" class="fade-in">
                        <div class="toggle-row">
                            <div>
                                <strong style="display:block; margin-bottom:2px; color:#fff;">Public Schedule</strong>
                                <span style="font-size: 13px; color: var(--text-muted);">Allow classmates to find your classes</span>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="toggle-share">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <h2>My Classes</h2>
                        <div class="card" id="my-class-list" style="padding: 16px 20px;"></div>
                    </div>

                    <div id="tab-classmates" class="hidden fade-in">
                        <h2 style="margin-bottom: 20px;">WWHS Directory</h2>
                        <div class="classmates-grid" id="classmates-container"></div>
                    </div>

                    <div id="tab-settings" class="hidden fade-in">
                        <h2>Account Settings</h2>
                        <div class="card" style="text-align: center; padding: 40px 20px;">
                            <div class="cm-avatar" id="profile-avatar" style="width: 80px; height: 80px; font-size: 32px; margin: 0 auto 16px auto;"></div>
                            <h2 id="profile-name" style="margin-bottom: 4px;">Loading...</h2>
                            <p id="profile-email" style="color: var(--text-muted); margin-bottom: 30px;">...</p>
                            
                            <button class="btn btn-secondary" style="color: #f87171; border-color: rgba(248, 113, 113, 0.2); max-width: 250px; margin: 0 auto;" id="btn-logout-mob">
                                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="schedule">
                <i class="fa-solid fa-calendar-day"></i> Schedule
            </button>
            <button class="nav-item" data-tab="classmates">
                <i class="fa-solid fa-user-group"></i> Classmates
            </button>
            <button class="nav-item" data-tab="settings">
                <i class="fa-solid fa-gear"></i> Settings
            </button>
        </nav>
    </div>

    <!-- Firebase System Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhbKywSRayDsHPpfBVSojVm5ESMQly6do",
            authDomain: "wwhs-schedule.firebaseapp.com",
            projectId: "wwhs-schedule",
            storageBucket: "wwhs-schedule.firebasestorage.app",
            messagingSenderId: "281839558316",
            appId: "1:281839558316:web:f5cc21aad4383ba8458909"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const splashScreen = document.getElementById('splash-screen');
        const authView = document.getElementById('auth-view');
        const mainApp = document.getElementById('main-app');
        const loginCard = document.getElementById('login-card');
        const signupCard = document.getElementById('signup-card');

        // Exactly 6-second premium splash screen timeout
        setTimeout(() => {
            splashScreen.style.opacity = '0';
            setTimeout(() => splashScreen.classList.add('hidden'), 800);
        }, 6000);

        function showScreen(screen) {
            if(screen === 'login') {
                authView.classList.remove('hidden');
                loginCard.classList.remove('hidden');
                signupCard.classList.add('hidden');
                mainApp.classList.add('hidden');
            } else if (screen === 'signup') {
                authView.classList.remove('hidden');
                signupCard.classList.remove('hidden');
                loginCard.classList.add('hidden');
                mainApp.classList.add('hidden');
            } else if (screen === 'app') {
                authView.classList.add('hidden');
                mainApp.classList.remove('hidden');
                loadUserData();
            }
        }

        document.getElementById('link-to-signup').addEventListener('click', () => showScreen('signup'));
        document.getElementById('link-to-login').addEventListener('click', () => showScreen('login'));

        function setStep(step) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.progress-bar').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + step).classList.add('active');
            for(let i=1; i<=step; i++) document.getElementById('prog-' + i).classList.add('active');
        }

        document.getElementById('btn-next-1').addEventListener('click', () => {
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;
            if(!email || pass.length < 6) return alert("Please enter a valid email and password (min 6 chars).");
            setStep(2);
        });
        
        document.getElementById('btn-next-2').addEventListener('click', () => {
            const name = document.getElementById('signup-name').value;
            if(!name) return alert("Please enter your name.");
            setStep(3);
        });
        
        document.querySelectorAll('.btn-prev').forEach(btn => {
            btn.addEventListener('click', (e) => setStep(parseInt(e.target.dataset.target)));
        });

        document.getElementById('btn-finish').addEventListener('click', async () => {
            const btn = document.getElementById('btn-finish');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            try {
                const schedule = {};
                for(let i=1; i<=7; i++) schedule[i] = document.getElementById('p'+i).value || "Free Period";
                
                const userCred = await createUserWithEmailAndPassword(auth, document.getElementById('signup-email').value, document.getElementById('signup-password').value);
                await setDoc(doc(db, "students", userCred.user.uid), {
                    name: document.getElementById('signup-name').value,
                    grade: document.getElementById('signup-grade').value,
                    email: document.getElementById('signup-email').value,
                    shared: true,
                    schedule: schedule
                });
            } catch(e) { 
                alert(e.message); 
                btn.innerHTML = 'Complete Signup'; 
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
            } catch(e) { 
                alert(e.message); 
                btn.innerHTML = 'Sign In'; 
            }
        });

        const doLogout = () => signOut(auth);
        document.getElementById('btn-logout-desk').addEventListener('click', doLogout);
        document.getElementById('btn-logout-mob').addEventListener('click', doLogout);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                showScreen('app');
            } else {
                showScreen('login');
            }
        });

        const navItems = document.querySelectorAll('.nav-item');
        const tabs = {
            'schedule': document.getElementById('tab-schedule'),
            'classmates': document.getElementById('tab-classmates'),
            'settings': document.getElementById('tab-settings')
        };

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetId = item.dataset.tab;
                if(!targetId) return;

                document.querySelectorAll('.nav-item').forEach(n => {
                    if(n.dataset.tab === targetId) n.classList.add('active');
                    else n.classList.remove('active');
                });
                
                Object.values(tabs).forEach(t => t.classList.add('hidden'));
                if(tabs[targetId]) tabs[targetId].classList.remove('hidden');

                if(targetId === 'classmates') loadClassmates();
            });
        });

        async function loadUserData() {
            if(!auth.currentUser) return;
            try {
                const docSnap = await getDoc(doc(db, "students", auth.currentUser.uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const initial = data.name ? data.name.charAt(0).toUpperCase() : 'U';
                    
                    document.getElementById('profile-name').innerText = data.name || 'Student';
                    document.getElementById('profile-email').innerText = data.email || auth.currentUser.email;
                    document.getElementById('profile-avatar').innerText = initial;
                    document.getElementById('mobile-avatar').innerText = initial;
                    document.getElementById('toggle-share').checked = !!data.shared;
                    
                    const list = document.getElementById('my-class-list');
                    list.innerHTML = '';
                    for(let i=1; i<=7; i++) {
                        list.innerHTML += `
                            <div class="timeline-item">
                                <div class="period-bubble">P${i}</div>
                                <div class="class-info">${data.schedule && data.schedule[i] ? data.schedule[i] : 'Free Period'}</div>
                            </div>
                        `;
                    }
                }
            } catch(err) {
                console.error("Error loading user data:", err);
            }
        }

        document.getElementById('toggle-share').addEventListener('change', async (e) => {
            if(auth.currentUser) {
                await updateDoc(doc(db, "students", auth.currentUser.uid), { shared: e.target.checked });
            }
        });

        async function loadClassmates() {
            const container = document.getElementById('classmates-container');
            container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--primary); font-size: 24px;"><i class="fa-solid fa-spinner fa-spin"></i></div>';
            
            try {
                const q = query(collection(db, "students"), where("shared", "==", true));
                const snap = await getDocs(q);
                
                container.innerHTML = '';
                if(snap.empty) {
                    container.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No shared schedules found.</div>';
                    return;
                }

                snap.forEach((docSnap) => {
                    if(auth.currentUser && docSnap.id === auth.currentUser.uid) return;
                    const data = docSnap.data();
                    
                    let scheduleHTML = '';
                    for(let i=1; i<=7; i++) {
                        scheduleHTML += `<div class="cm-class"><i class="fa-solid fa-clock"></i> P${i}: ${data.schedule && data.schedule[i] ? data.schedule[i] : 'Free'}</div>`;
                    }

                    container.innerHTML += `
                        <div class="classmate-card fade-in">
                            <div class="cm-header">
                                <div class="cm-avatar">${data.name ? data.name.charAt(0).toUpperCase() : '?'}</div>
                                <div class="cm-details">
                                    <h3>${data.name || 'Student'}</h3>
                                    <span>Grade ${data.grade || '--'}</span>
                                </div>
                            </div>
                            <div class="cm-classes">${scheduleHTML}</div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<div class="card" style="color:#f87171; text-align:center;">Error loading classmates.</div>';
            }
        }
    </script>
</body>
</html>
