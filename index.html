<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WWHS Schedule Share</title>
    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        .slide-up { animation: slideUp 0.5s ease forwards; }

        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            margin-bottom: 20px;
        }

        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        p.subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; line-height: 1.5; }

        /* Auth Layout */
        .auth-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-color);
            position: fixed;
            inset: 0;
            z-index: 1000;
        }
        .auth-card {
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
        }

        /* Forms */
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); transition: var(--transition);
        }
        input {
            width: 100%; background: var(--bg-color); border: 2px solid transparent;
            padding: 14px 14px 14px 44px; border-radius: 12px; font-size: 15px;
            font-weight: 500; color: var(--text-main); transition: var(--transition);
            outline: none;
        }
        input:focus {
            background: var(--surface); border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        input:focus + i, .input-group:focus-within i { color: var(--primary); }

        /* Buttons */
        .btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: var(--transition); display: flex; justify-content: center;
            align-items: center; gap: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); }
        .btn-secondary:hover { background: #e5e7eb; }
        .btn-text { background: transparent; color: var(--primary); margin-top: 10px; }

        /* Progress Bar */
        .progress-container { display: flex; gap: 8px; margin-bottom: 30px; }
        .progress-bar { flex: 1; height: 6px; background: var(--bg-color); border-radius: 10px; transition: var(--transition); }
        .progress-bar.active { background: var(--primary); }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.3s ease; }
        .step-actions { display: flex; gap: 12px; margin-top: 20px; }

        /* Dashboard App Layout */
        .app-container {
            flex: 1; display: flex; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-color);
        }
        
        .sidebar {
            display: none;
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            flex-direction: column;
        }
        .sidebar-logo { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 40px; display: flex; align-items: center; gap: 12px;}
        .sidebar-nav { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            border-radius: 12px; color: var(--text-muted); font-weight: 600;
            cursor: pointer; transition: var(--transition); background: transparent; border: none; width: 100%; text-align: left; font-size: 15px;
        }
        .nav-item:hover { background: var(--bg-color); color: var(--text-main); }
        .nav-item.active { background: var(--primary-light); color: var(--primary-dark); }
        
        .main-content-area {
            flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden;
        }
        
        .mobile-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        
        .main-content {
            flex: 1; overflow-y: auto; padding: 24px;
            padding-bottom: calc(100px + var(--safe-bottom));
        }
        .content-max-width { max-width: 1000px; margin: 0 auto; }

        .card {
            background: var(--surface); border-radius: var(--radius);
            padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; background: var(--surface); border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border);
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        .timeline-item { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; }
        .period-bubble {
            width: 44px; height: 44px; border-radius: 12px; background: var(--primary-light);
            color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; flex-shrink: 0;
        }
        .class-info {
            background: var(--bg-color); padding: 14px; border-radius: 12px;
            flex: 1; font-weight: 600; font-size: 15px;
        }

        .classmates-grid {
            display: grid; grid-template-columns: 1fr; gap: 20px;
        }
        .classmate-card {
            background: var(--surface); border-radius: var(--radius); padding: 20px;
            box-shadow: var(--shadow-md); border-top: 4px solid var(--primary); border: 1px solid var(--border);
        }
        .cm-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--bg-color); }
        .cm-avatar {
            width: 48px; height: 48px; border-radius: 50%; background: var(--primary-light);
            color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; flex-shrink: 0;
        }
        .cm-details h3 { font-size: 16px; margin: 0 0 2px 0; }
        .cm-details span { font-size: 13px; color: var(--text-muted); }
        .cm-classes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cm-class {
            background: var(--bg-color); padding: 8px 10px; border-radius: 8px;
            font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;
        }
        .cm-class i { color: var(--primary); font-size: 10px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around;
            padding: 10px 10px var(--safe-bottom) 10px;
            border-top: 1px solid var(--border); z-index: 100;
        }
        .bottom-nav .nav-item {
            flex-direction: column; gap: 4px; padding: 8px; border-radius: 0;
            font-size: 11px; flex: 1; align-items: center; justify-content: center;
        }
        .bottom-nav .nav-item i { font-size: 20px; }

        @media (min-width: 768px) {
            .sidebar { display: flex; }
            .bottom-nav { display: none; }
            .mobile-header { display: none; }
            .main-content { padding: 40px; }
            .classmates-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- Auth / Login & Signup Overlay -->
    <div class="auth-wrapper" id="auth-view">
        
        <!-- Login Card -->
        <div class="auth-card slide-up" id="login-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <div class="logo-box" style="margin: 0 auto 16px auto;">W</div>
                <h2>Welcome Back</h2>
                <p class="subtitle" style="margin-bottom:0;">Sign in to see your classes.</p>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="login-email" placeholder="School Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-password" placeholder="Password">
            </div>
            <button class="btn btn-primary" id="btn-login" style="margin-top: 10px;">Sign In</button>
            <button class="btn btn-text" id="link-to-signup">Create new account</button>
        </div>

        <!-- Signup Card -->
        <div class="auth-card slide-up hidden" id="signup-card">
            <h2 style="text-align: center; margin-bottom: 20px;">Join WWHS</h2>
            
            <div class="progress-container">
                <div class="progress-bar active" id="prog-1"></div>
                <div class="progress-bar" id="prog-2"></div>
                <div class="progress-bar" id="prog-3"></div>
            </div>

            <div id="step-1" class="step-content active">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="School Email">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="Create Password (min 6 chars)">
                </div>
                <button class="btn btn-primary" id="btn-next-1" style="margin-top:20px;">Next</button>
                <button class="btn btn-text" id="link-to-login">Back to Sign In</button>
            </div>

            <div id="step-2" class="step-content">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="signup-name" placeholder="First & Last Name">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <input type="number" id="signup-grade" placeholder="Grade Level (9-12)">
                </div>
                <div class="step-actions">
                    <button class="btn btn-secondary btn-prev" data-target="1">Back</button>
                    <button class="btn btn-primary" id="btn-next-2">Next</button>
                </div>
            </div>

            <div id="step-3" class="step-content">
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px; text-align:center;">Enter your teachers or class names.</p>
                <div style="max-height: 220px; overflow-y: auto; padding-right: 5px;">
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p1" placeholder="Period 1"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p2" placeholder="Period 2"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p3" placeholder="Period 3"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p4" placeholder="Period 4"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p5" placeholder="Period 5"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p6" placeholder="Period 6"></div>
                    <div class="input-group"><i class="fa-solid fa-book" style="font-size:12px;"></i><input type="text" id="p7" placeholder="Period 7"></div>
                </div>
                <div class="step-actions">
                    <button class="btn btn-secondary btn-prev" data-target="2">Back</button>
                    <button class="btn btn-primary" id="btn-finish">Complete Signup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Application -->
    <div class="app-container hidden" id="main-app">
        
        <!-- Desktop Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-box" style="width: 36px; height:36px; font-size:16px; margin:0; border-radius:10px;">W</div> 
                WWHS Schedule
            </div>
            <div class="sidebar-nav">
                <button class="nav-item active" data-tab="schedule">
                    <i class="fa-solid fa-calendar-day"></i> My Schedule
                </button>
                <button class="nav-item" data-tab="classmates">
                    <i class="fa-solid fa-user-group"></i> Classmates
                </button>
                <button class="nav-item" data-tab="settings">
                    <i class="fa-solid fa-gear"></i> Settings
                </button>
            </div>
            <button class="btn btn-secondary" id="btn-logout-desk" style="color: #ef4444; margin-top: auto;">
                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
            </button>
        </nav>

        <div class="main-content-area">
            <!-- Mobile Header -->
            <div class="mobile-header">
                <h2 style="margin: 0; color: var(--text-main); font-size: 18px;">WWHS Schedule</h2>
                <div id="mobile-avatar" class="cm-avatar" style="width: 36px; height: 36px; font-size: 14px;">?</div>
            </div>

            <!-- Scrollable Content Hub -->
            <main class="main-content">
                <div class="content-max-width">
                    
                    <!-- Schedule Tab -->
                    <div id="tab-schedule" class="fade-in">
                        <div class="toggle-row">
                            <div>
                                <strong style="display:block; margin-bottom:2px;">Public Schedule</strong>
                                <span style="font-size: 13px; color: var(--text-muted);">Allow classmates to find your classes</span>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="toggle-share">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <h2>My Classes</h2>
                        <div class="card" id="my-class-list" style="padding: 16px 20px;">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Classmates Tab -->
                    <div id="tab-classmates" class="hidden fade-in">
                        <h2 style="margin-bottom: 20px;">WWHS Directory</h2>
                        <div class="classmates-grid" id="classmates-container">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Settings Tab -->
                    <div id="tab-settings" class="hidden fade-in">
                        <h2>Account Settings</h2>
                        <div class="card" style="text-align: center; padding: 40px 20px;">
                            <div class="cm-avatar" id="profile-avatar" style="width: 80px; height: 80px; font-size: 32px; margin: 0 auto 16px auto;"></div>
                            <h2 id="profile-name" style="margin-bottom: 4px;">Loading...</h2>
                            <p id="profile-email" style="color: var(--text-muted); margin-bottom: 30px;">...</p>
                            
                            <button class="btn btn-secondary" style="color: #ef4444; max-width: 250px; margin: 0 auto;" id="btn-logout-mob">
                                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                            </button>
                        </div>
                    </div>

                </div>
            </main>
        </div>

        <!-- Mobile Bottom Nav -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="schedule">
                <i class="fa-solid fa-calendar-day"></i> Schedule
            </button>
            <button class="nav-item" data-tab="classmates">
                <i class="fa-solid fa-user-group"></i> Classmates
            </button>
            <button class="nav-item" data-tab="settings">
                <i class="fa-solid fa-gear"></i> Settings
            </button>
        </nav>

    </div>

    <!-- Firebase System Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhbKywSRayDsHPpfBVSojVm5ESMQly6do",
            authDomain: "wwhs-schedule.firebaseapp.com",
            projectId: "wwhs-schedule",
            storageBucket: "wwhs-schedule.firebasestorage.app",
            messagingSenderId: "281839558316",
            appId: "1:281839558316:web:f5cc21aad4383ba8458909"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authView = document.getElementById('auth-view');
        const mainApp = document.getElementById('main-app');
        const loginCard = document.getElementById('login-card');
        const signupCard = document.getElementById('signup-card');

        function showScreen(screen) {
            if(screen === 'login') {
                authView.classList.remove('hidden');
                loginCard.classList.remove('hidden');
                signupCard.classList.add('hidden');
                mainApp.classList.add('hidden');
            } else if (screen === 'signup') {
                authView.classList.remove('hidden');
                signupCard.classList.remove('hidden');
                loginCard.classList.add('hidden');
                mainApp.classList.add('hidden');
            } else if (screen === 'app') {
                authView.classList.add('hidden');
                mainApp.classList.remove('hidden');
                loadUserData();
            }
        }

        document.getElementById('link-to-signup').addEventListener('click', () => showScreen('signup'));
        document.getElementById('link-to-login').addEventListener('click', () => showScreen('login'));

        function setStep(step) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.progress-bar').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + step).classList.add('active');
            for(let i=1; i<=step; i++) document.getElementById('prog-' + i).classList.add('active');
        }

        document.getElementById('btn-next-1').addEventListener('click', () => {
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;
            if(!email || pass.length < 6) return alert("Please enter a valid email and a password of at least 6 characters.");
            setStep(2);
        });
        
        document.getElementById('btn-next-2').addEventListener('click', () => {
            const name = document.getElementById('signup-name').value;
            if(!name) return alert("Please enter your name.");
            setStep(3);
        });
        
        document.querySelectorAll('.btn-prev').forEach(btn => {
            btn.addEventListener('click', (e) => setStep(parseInt(e.target.dataset.target)));
        });

        document.getElementById('btn-finish').addEventListener('click', async () => {
            const btn = document.getElementById('btn-finish');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            try {
                const schedule = {};
                for(let i=1; i<=7; i++) schedule[i] = document.getElementById('p'+i).value || "Free Period";
                
                const userCred = await createUserWithEmailAndPassword(auth, document.getElementById('signup-email').value, document.getElementById('signup-password').value);
                await setDoc(doc(db, "students", userCred.user.uid), {
                    name: document.getElementById('signup-name').value,
                    grade: document.getElementById('signup-grade').value,
                    email: document.getElementById('signup-email').value,
                    shared: true,
                    schedule: schedule
                });
            } catch(e) { 
                alert(e.message); 
                btn.innerHTML = 'Complete Signup'; 
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
            } catch(e) { 
                alert(e.message); 
                btn.innerHTML = 'Sign In'; 
            }
        });

        const doLogout = () => signOut(auth);
        document.getElementById('btn-logout-desk').addEventListener('click', doLogout);
        document.getElementById('btn-logout-mob').addEventListener('click', doLogout);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                showScreen('app');
            } else {
                showScreen('login');
            }
        });

        // Tab Navigation Handling
        const navItems = document.querySelectorAll('.nav-item');
        const tabs = {
            'schedule': document.getElementById('tab-schedule'),
            'classmates': document.getElementById('tab-classmates'),
            'settings': document.getElementById('tab-settings')
        };

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetId = item.dataset.tab;
                if(!targetId) return;

                document.querySelectorAll('.nav-item').forEach(n => {
                    if(n.dataset.tab === targetId) n.classList.add('active');
                    else n.classList.remove('active');
                });
                
                Object.values(tabs).forEach(t => t.classList.add('hidden'));
                if(tabs[targetId]) tabs[targetId].classList.remove('hidden');

                if(targetId === 'classmates') loadClassmates();
            });
        });

        async function loadUserData() {
            if(!auth.currentUser) return;
            try {
                const docSnap = await getDoc(doc(db, "students", auth.currentUser.uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const initial = data.name ? data.name.charAt(0).toUpperCase() : 'U';
                    
                    document.getElementById('profile-name').innerText = data.name || 'Student';
                    document.getElementById('profile-email').innerText = data.email || auth.currentUser.email;
                    document.getElementById('profile-avatar').innerText = initial;
                    document.getElementById('mobile-avatar').innerText = initial;
                    document.getElementById('toggle-share').checked = !!data.shared;
                    
                    const list = document.getElementById('my-class-list');
                    list.innerHTML = '';
                    for(let i=1; i<=7; i++) {
                        list.innerHTML += `
                            <div class="timeline-item">
                                <div class="period-bubble">P${i}</div>
                                <div class="class-info">${data.schedule && data.schedule[i] ? data.schedule[i] : 'Free Period'}</div>
                            </div>
                        `;
                    }
                }
            } catch(err) {
                console.error("Error loading user data:", err);
            }
        }

        document.getElementById('toggle-share').addEventListener('change', async (e) => {
            if(auth.currentUser) {
                await updateDoc(doc(db, "students", auth.currentUser.uid), { shared: e.target.checked });
            }
        });

        async function loadClassmates() {
            const container = document.getElementById('classmates-container');
            container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--primary); font-size: 24px;"><i class="fa-solid fa-spinner fa-spin"></i></div>';
            
            try {
                const q = query(collection(db, "students"), where("shared", "==", true));
                const snap = await getDocs(q);
                
                container.innerHTML = '';
                if(snap.empty) {
                    container.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No shared schedules found.</div>';
                    return;
                }

                snap.forEach((docSnap) => {
                    if(auth.currentUser && docSnap.id === auth.currentUser.uid) return;
                    const data = docSnap.data();
                    
                    let scheduleHTML = '';
                    for(let i=1; i<=7; i++) {
                        scheduleHTML += `<div class="cm-class"><i class="fa-solid fa-clock"></i> P${i}: ${data.schedule && data.schedule[i] ? data.schedule[i] : 'Free'}</div>`;
                    }

                    container.innerHTML += `
                        <div class="classmate-card slide-up">
                            <div class="cm-header">
                                <div class="cm-avatar">${data.name ? data.name.charAt(0).toUpperCase() : '?'}</div>
                                <div class="cm-details">
                                    <h3>${data.name || 'Student'}</h3>
                                    <span>Grade ${data.grade || '--'}</span>
                                </div>
                            </div>
                            <div class="cm-classes">${scheduleHTML}</div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<div class="card" style="color:red; text-align:center;">Error loading classmates. Check permissions.</div>';
            }
        }
    </script>
</body>
</html>
